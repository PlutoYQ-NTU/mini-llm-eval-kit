[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-eval-kit"
version = "0.1.0"
description = "Lightweight evaluation toolkit for small local language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "mini-llm-eval-kit contributors" }
]
keywords = ["llm", "local-llm", "evaluation", "cli", "python", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mini-llm-eval = "mini_llm_eval_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
